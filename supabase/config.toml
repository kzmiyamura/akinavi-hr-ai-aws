# ローカルテスト用設定: 別プロジェクト（mood-song-share が 54321-54327 使用中）と
# ポート衝突しないよう 5433x に退避。studio 等の不要サービスは無効化して軽量起動
project_id = "akinavi-hr-ai-aws"

[api]
port = 54331

[db]
port = 54332
shadow_port = 54330

[studio]
enabled = false

[analytics]
enabled = false

[realtime]
enabled = false

[inbucket]
enabled = false
port = 54334

[functions.inbound-email]
enabled = true
verify_jwt = true
import_map = "./functions/inbound-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/inbound-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/inbound-email/*.html" ]
